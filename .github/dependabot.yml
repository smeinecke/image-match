# Dependabot version updates for all dependency ecosystems in this repo.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # elasticsearch-py 8.x is incompatible with the ES 7.x index format
      # and query DSL this project targets; the <8 pin is intentional.
      - dependency-name: "elasticsearch"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
