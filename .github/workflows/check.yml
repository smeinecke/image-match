name: Code Checks

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Primes
        id: cache-primes
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-cache-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-cache-

      - name: Set up Python environment
        run: |
          wget -qO- https://astral.sh/uv/install.sh | sh
          uv sync --all-extras

      - name: Run Ruff (PEP 8 Formatting)
        run: |
          uv run make format

      - name: Run Ruff (Linting + Docstrings)
        run: |
          uv run make check

      - name: Run vulture (Duplicate Code)
        run: |
          uv run make vulture

      - name: Run xenon (Cyclomatic Complexity)
        run: |
          uv run make xenon

      - name: Run bandit (Security)
        run: |
          uv run make bandit

      - name: Run pyright (Type Checking)
        run: |
          uv run make pyright

      - name: Run pytest (Unit Tests)
        run: |
          uv run pytest tests -v -m "not integration" --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage.xml

  integration:
    name: Integration Tests (Elasticsearch & MongoDB)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start Elasticsearch and MongoDB
        run: |
          docker compose up -d elasticsearch mongodb
          # Wait for Elasticsearch to be ready
          echo "Waiting for Elasticsearch to start..."
          timeout 180 bash -c 'until curl -sf http://localhost:9200/_cluster/health >/dev/null; do sleep 2; done'
          echo "Elasticsearch is ready!"
          # Wait for MongoDB to be ready
          echo "Waiting for MongoDB to start..."
          timeout 60 bash -c 'until nc -z localhost 27017; do sleep 1; done'
          echo "MongoDB is ready!"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-cache-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-cache-

      - name: Set up Python environment
        run: |
          wget -qO- https://astral.sh/uv/install.sh | sh
          uv sync --all-extras

      - name: Run Integration Tests
        run: |
          uv run pytest tests -v -m integration --timeout=120

      - name: Stop services
        if: always()
        run: docker compose down
