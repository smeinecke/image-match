name: Code Checks

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Primes
        id: cache-primes
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python environment
        run: uv sync --all-extras

      - name: Build wheel
        run: uv build

      - name: Run Ruff (PEP 8 Formatting)
        run: |
          uv run make format

      - name: Run Ruff (Linting + Docstrings)
        run: |
          uv run make check

      - name: Run vulture (Duplicate Code)
        run: |
          uv run make vulture

      - name: Run xenon (Cyclomatic Complexity)
        run: |
          uv run make xenon

      - name: Run bandit (Security)
        run: |
          uv run make bandit

      - name: Run pyright (Type Checking)
        run: |
          uv run make pyright

      - name: Build documentation
        run: |
          uv run make docs

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python environment
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run pytest (Unit Tests)
        run: |
          # --no-sync: the sync step above already built the venv for the
          # matrix python. A bare `uv run` would re-resolve against
          # .python-version (3.13), switching interpreter and dropping extras.
          uv run --no-sync pytest tests -v -m "not integration" --cov=image_match --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage.xml

  integration:
    name: Integration Tests (Elasticsearch, OpenSearch & MongoDB)
    runs-on: ubuntu-latest
    needs: [validate, test]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start Elasticsearch, OpenSearch, MongoDB and Toxiproxy
        run: |
          docker compose up -d elasticsearch mongodb opensearch opensearch3 toxiproxy
          # Wait for Toxiproxy to be ready
          echo "Waiting for Toxiproxy to start..."
          timeout 30 bash -c 'until curl -sf http://localhost:8475/version >/dev/null; do sleep 1; done'
          echo "Toxiproxy is ready!"
          # Wait for Elasticsearch to be ready
          echo "Waiting for Elasticsearch to start..."
          timeout 180 bash -c 'until curl -sf http://localhost:9200/_cluster/health >/dev/null; do sleep 2; done'
          echo "Elasticsearch is ready!"
          # Wait for MongoDB to be ready
          echo "Waiting for MongoDB to start..."
          timeout 60 bash -c 'until nc -z localhost 27017; do sleep 1; done'
          echo "MongoDB is ready!"
          # Wait for OpenSearch 2 to be ready
          echo "Waiting for OpenSearch 2 to start..."
          timeout 180 bash -c 'until curl -sf http://localhost:9201/_cluster/health >/dev/null; do sleep 2; done'
          echo "OpenSearch 2 is ready!"
          # Wait for OpenSearch 3 to be ready
          echo "Waiting for OpenSearch 3 to start..."
          timeout 180 bash -c 'until curl -sf http://localhost:9202/_cluster/health >/dev/null; do sleep 2; done'
          echo "OpenSearch 3 is ready!"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-cache-

      - name: Set up Python environment
        run: uv sync --all-extras

      - name: Run Integration Tests
        run: |
          uv run --no-sync pytest tests -v -m integration --timeout=120

      - name: Stop services
        if: always()
        run: docker compose down
