[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-match"
dynamic = ["version"]
description = "image_match is a simple package for finding approximate image matches from a corpus."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSES.md"]
authors = [
    { name = "Ryan Henderson", email = "ryan@bigchaindb.com" },
]
keywords = ["image", "signature", "match", "deduplication", "perceptual-hash"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]
docs = [
    "Sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
]
elasticsearch = [
    "elasticsearch>=7.17.0,<8.0.0",
]
opensearch = [
    "opensearch-py>=2.4",
]
mongo = [
    "pymongo>=4.0",
]
extra = [
    "cairosvg>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/ascribe/image-match/"
Documentation = "http://image-match.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
    "coverage",
    "ipdb",
    "ipython",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.0",
    "ruff>=0.15",
    "radon>=6.0",
    "xenon>=0.9",
    "vulture>=2.16",
    "pyright>=1.1.400",
    "bandit>=1.8",
    "pre-commit>=4.0",
]

[tool.hatch.version]
path = "src/image_match/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/image_match"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
norecursedirs = [".*", "*.egg", "*.egg-info", "env*", "devenv*", "docs"]
markers = [
    "integration: marks tests that need running Elasticsearch/OpenSearch/MongoDB services",
]

[tool.ruff]
exclude = ["docs", "build", "dist", "*.egg-info", ".venv"]
src = ["src", "tests"]
target-version = "py313"
line-length = 160
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
preview = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = [
    "I",
]
select = ["E9", "F82", "D", "ANN", "UP", "C4", "SIM", "RUF"]
# D200/D205/D400/D401/D415: docstring style conventions relaxed for legacy docstrings
# ANN401: Any is legitimate for *args/**kwargs pass-throughs to driver backends
ignore = ["D203", "D213", "D100", "D200", "D205", "D400", "D401", "D415", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.pyright]
exclude = ["**/__pycache__", "**/dist", "**/build", "**/venv", "**/.venv"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
# B101: asserts are intentional input validation; callers may rely on AssertionError
skips = ["B101"]

[tool.vulture]
exclude = ["dist", "build", "venv", ".venv", "tests", "docs"]
min_confidence = 80
paths = ["."]
sort_by_size = true
