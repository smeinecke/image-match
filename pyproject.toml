[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-match"
dynamic = ["version"]
description = "image_match is a simple package for finding approximate image matches from a corpus."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSES.md"]
authors = [
    { name = "Ryan Henderson", email = "ryan@bigchaindb.com" },
]
keywords = ["image", "signature", "match", "deduplication", "perceptual-hash"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
]
docs = [
    "Sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
]
elasticsearch = [
    "elasticsearch>=7.17.0,<8.0.0",
]
elasticsearch-async = [
    "elasticsearch[async]>=7.17.0,<8.0.0",
]
opensearch = [
    "opensearch-py>=2.4",
]
opensearch-async = [
    "opensearch-py[async]>=2.4",
]
mongo = [
    "pymongo>=4.0",
]
extra = [
    "cairosvg>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/smeinecke/image-match/"
Documentation = "https://smeinecke.github.io/image-match/"

[dependency-groups]
dev = [
    "coverage",
    "ipdb",
    "ipython",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.0",
    "ruff>=0.15",
    "radon>=6.0",
    "xenon>=0.9",
    "vulture>=2.16",
    "pyright>=1.1.400",
    "bandit>=1.8",
    "pre-commit>=4.0",
    "mutmut>=3.8.0",
]

[tool.hatch.version]
path = "src/image_match/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/image_match"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".*", "*.egg", "*.egg-info", "env*", "devenv*", "docs"]
markers = [
    "integration: marks tests that need running Elasticsearch/OpenSearch/MongoDB services",
]

[tool.ruff]
exclude = ["docs", "build", "dist", "*.egg-info", ".venv"]
src = ["src", "tests"]
target-version = "py313"
line-length = 160
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
preview = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = [
    "I",
]
select = ["E9", "F82", "D", "ANN", "UP", "C4", "SIM", "RUF"]
# D200/D205/D400/D401/D415: docstring style conventions relaxed for legacy docstrings
# ANN401: Any is legitimate for *args/**kwargs pass-throughs to driver backends
ignore = ["D203", "D213", "D100", "D200", "D205", "D400", "D401", "D415", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.coverage.report]
fail_under = 80

[tool.pyright]
typeCheckingMode = "strict"
# Unknown-* rules only measure third-party stub completeness
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false
reportPrivateUsage = false
exclude = ["**/__pycache__", "**/dist", "**/build", "**/venv", "**/.venv", "tests", "docs", "mutants"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
# B101: asserts are intentional input validation; callers may rely on AssertionError
skips = ["B101"]

[tool.vulture]
exclude = ["dist", "build", "venv", ".venv", "tests", "docs", "mutants"]
min_confidence = 80
paths = ["."]
sort_by_size = true

[tool.mutmut]
source_paths = ["src/image_match/", "tools/migrate_to_knn.py"]
pytest_add_cli_args_test_selection = ["tests/", "-m", "not integration"]
mutate_only_covered_lines = true
# Lines whose mutations can never change behaviour:
#  - handle_mpo: vestigial API-compat parameter, accepted but unused
#  - help=/description=/formatter_class: argparse metadata text
#  - bare print(...) lines: CLI progress reporting
#  - cast(...): typing.cast is a runtime no-op
#  - rec.pop("path"/"metadata", ...): dead defensive code — only simple_word_*
#    keys enter the query's should-clause anyway
#  - 'if png else': falsy png -> Image.open raises -> same CorruptImageError path
#  - asarray(img, dtype=np.uint8): PIL image is already uint8 after convert("RGB")
#  - norm(vec, axis=0): vec is guaranteed 1-D so every axis mutation is a no-op
do_not_mutate_patterns = [
    'handle_mpo',
    'help=',
    'description=',
    'formatter_class',
    '^\s*print\(',
    'cast\(',
    'pop\("path"',
    'pop\("metadata"',
    'if png else',
    'asarray\(img',
    'norm\(vec, axis=0\)',
]
# conftest stages test images from the committed docs images
also_copy = ["docs/source/_images/"]
